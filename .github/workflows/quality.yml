name: NonNon quality checks

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nonnon-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and Expo export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Expo dependency compatibility
        run: npx expo-doctor

      - name: TypeScript check
        run: npm run typecheck

      - name: Export web bundle
        run: npm run build:web
